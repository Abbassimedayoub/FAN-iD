# Prometheus is not started by default by docker-compose.yml, but this
# configuration is ready for optional local monitoring and later deployment.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: fanid-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
