# Prometheus — non lancé par défaut dans docker-compose.yml (hors des 8 services du S0,
# §2.1/§7.1) mais fourni prêt à l'emploi pour un `docker compose -f ... up` optionnel de
# supervision locale, et comme socle direct pour le déploiement S5.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: fanid-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
