# Nginx — edge du Sprint 0 : TLS en prod (hors périmètre local), routage, rate limit L7.
limit_req_zone $binary_remote_addr zone=fanid_general:10m rate=10r/s;

upstream fanid_api {
    server api:8000;
}

upstream fanid_ws {
    server ws:8001;
}

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;

    location /ws/ {
        proxy_pass http://fanid_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location / {
        limit_req zone=fanid_general burst=20 nodelay;
        proxy_pass http://fanid_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
