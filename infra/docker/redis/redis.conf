# Redis — single instance for cache, locks, sessions, channel layer, and Celery broker.
# One Redis container is partitioned logically by database number.
# See .env.example: REDIS_CACHE_DB=0, REDIS_CHANNEL_LAYER_DB=1, REDIS_LOCK_DB=2,
# CELERY_BROKER_URL=.../3, CELERY_RESULT_BACKEND=.../4.
#
# Eviction policy: the Celery broker and device locks share this instance with
# the cache. `noeviction` is safer than `allkeys-lru`: losing a Celery queue
# message or idempotency lock under memory pressure would be a silent data loss,
# while an explicit write failure can be retried.
maxmemory 256mb
maxmemory-policy noeviction

# Persistence: AOF protects Celery messages and idempotency locks across restarts.
appendonly yes
appendfsync everysec

save 900 1
save 300 10
save 60 10000

# Baseline security for a development instance exposed only on 127.0.0.1.
protected-mode no
