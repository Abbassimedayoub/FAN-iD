# Redis — instance unique (cache + verrous + sessions + channel layer + broker Celery)
# Conforme au C4 conteneurs de Source A (§1.4.2) et au compte de 8 services de
# Source B (§2.1) : un seul conteneur Redis logiquement partitionné par numéro de DB
# (voir .env.example : REDIS_CACHE_DB=0, REDIS_CHANNEL_LAYER_DB=1, REDIS_LOCK_DB=2,
# CELERY_BROKER_URL=.../3, CELERY_RESULT_BACKEND=.../4).
#
# Politique d'éviction : le broker Celery et les verrous de dispositif partagent cette
# instance avec le cache. `noeviction` est retenu plutôt que `allkeys-lru` : perdre un
# message de queue Celery ou un verrou d'idempotence sous pression mémoire serait une
# perte de données silencieuse, pire qu'un refus d'écriture explicite (le client Celery
# retente ; un cache qui échoue à écrire ne fait que retourner en base, sans dommage).
maxmemory 256mb
maxmemory-policy noeviction

# Persistance : AOF pour ne pas perdre les messages Celery / idempotence-lock au redémarrage.
appendonly yes
appendfsync everysec

save 900 1
save 300 10
save 60 10000

# Sécurité de base pour un environnement de dev exposé uniquement sur 127.0.0.1.
protected-mode no
