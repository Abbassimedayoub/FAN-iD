name: ci-diagnostics

on:
  push:
    branches: [ci/fix-main-quality-gates]

jobs:
  backend-qr:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:15.8-alpine
        env:
          POSTGRES_DB: fanid_test
          POSTGRES_USER: fanid
          POSTGRES_PASSWORD: fanid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fanid" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-prod-xxxxxxxxxxxxxxxxxxxx
      JWT_SIGNING_KEY: ci-test-jwt-signing-key-not-for-prod-xxxxxxxxxxxxxxxxxxxxxxxx
      DATABASE_URL: postgresql://fanid:fanid@localhost:5432/fanid_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/3
      CELERY_RESULT_BACKEND: redis://localhost:6379/4
      APP_VERSION: ci
      COMMIT_SHA: diagnostics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/test.txt
      - working-directory: backend
        run: pip install -r requirements/test.txt
      - name: Release journey QR tests
        working-directory: backend
        run: pytest -q --no-cov apps/core/tests/test_release_journeys.py

  docker-size:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t fanid-api:prod-candidate --target prod backend
      - name: Report production image size
        run: |
          SIZE_MB=$(docker image inspect fanid-api:prod-candidate --format='{{.Size}}' | awk '{print int($1/1024/1024)}')
          echo "PROD_IMAGE_SIZE_MB=$SIZE_MB"
          test "$SIZE_MB" -le 400

  mobile-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter test --coverage
      - name: Coverage by file
        run: |
          python3 - <<'PY'
          from pathlib import Path

          current = None
          rows = []
          lf = lh = 0
          for raw in Path('mobile/coverage/lcov.info').read_text().splitlines():
              if raw.startswith('SF:'):
                  current = raw[3:]
                  lf = lh = 0
              elif raw.startswith('LF:'):
                  lf = int(raw[3:])
              elif raw.startswith('LH:'):
                  lh = int(raw[3:])
              elif raw == 'end_of_record' and current:
                  rows.append((lf - lh, lh, lf, current))
          total_lf = sum(r[2] for r in rows)
          total_lh = sum(r[1] for r in rows)
          print(f'TOTAL_COVERAGE={100 * total_lh / total_lf:.2f}% ({total_lh}/{total_lf})')
          for missed, hit, found, path in sorted(rows, reverse=True)[:40]:
              pct = 100 * hit / found if found else 100
              print(f'MISSED={missed:4d} HIT={hit:4d} LF={found:4d} PCT={pct:6.2f} FILE={path}')
          PY

  secret-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install detect-secrets==1.5.0
      - name: Report new baseline findings
        run: |
          cp .secrets.baseline /tmp/before.json
          detect-secrets scan --baseline .secrets.baseline
          python3 - <<'PY'
          import json

          before = json.load(open('/tmp/before.json', encoding='utf-8'))
          after = json.load(open('.secrets.baseline', encoding='utf-8'))
          approved = {
              (f, e.get('type'), e.get('hashed_secret'))
              for f, entries in before.get('results', {}).items()
              for e in entries
          }
          for f, entries in after.get('results', {}).items():
              for e in entries:
                  key = (f, e.get('type'), e.get('hashed_secret'))
                  if key not in approved:
                      print(f"NEW file={f} line={e.get('line_number')} type={e.get('type')}")
          PY
