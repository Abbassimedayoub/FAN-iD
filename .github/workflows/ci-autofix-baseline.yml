name: ci-autofix-baseline

on:
  push:
    branches: [ci/fix-main-quality-gates]

permissions:
  contents: write

jobs:
  update-reviewed-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/fix-main-quality-gates
          fetch-depth: 0

      - name: Install scanner
        run: pip install detect-secrets==1.5.0

      - name: Add only reviewed test fixtures to baseline
        run: |
          cp .secrets.baseline /tmp/baseline-before.json
          detect-secrets scan --baseline .secrets.baseline
          python3 - <<'PY'
          import json
          from pathlib import Path

          baseline_path = Path('.secrets.baseline')
          before = json.loads(Path('/tmp/baseline-before.json').read_text())
          after = json.loads(baseline_path.read_text())

          allowed_files = {
              'backend/apps/access/tests/test_admin_financial_dashboard.py',
              'backend/apps/access/tests/test_admissions.py',
              'backend/apps/access/tests/test_event_completion.py',
              'backend/apps/access/tests/test_final_reports.py',
              'backend/apps/catalog/tests/test_commission_access_gate.py',
              'backend/apps/catalog/tests/test_fan_catalog_api.py',
              'backend/apps/core/tests/test_release_journeys.py',
              'backend/apps/identity/tests/test_phone_change_endpoint.py',
              'backend/apps/notifying/tests/test_event_buyer_notifications.py',
              'backend/apps/ordering/tests/test_models.py',
              'backend/apps/ordering/tests/test_reservations.py',
              'backend/apps/organizing/tests/test_admin_reactivation_notifications_api.py',
              'backend/apps/organizing/tests/test_commission_api.py',
              'backend/apps/organizing/tests/test_commission_negotiation.py',
              'backend/apps/organizing/tests/test_scanner_phone_change_notifications.py',
              'backend/apps/payments/tests/test_models.py',
              'backend/apps/ticketing/tests/test_tickets.py',
              'backend/apps/ticketing/tests/test_transfers.py',
              'mobile/test/features/auth/presentation/pages/auth_entry_page_test.dart',
              'mobile/test/features/checkout/data/fan_checkout_remote_data_source_test.dart',
              'mobile/test/features/checkout/presentation/providers/fan_checkout_controller_test.dart',
          }

          known = {
              (filename, entry.get('type'), entry.get('hashed_secret'))
              for filename, entries in before.get('results', {}).items()
              for entry in entries
          }

          new_entries = []
          unexpected = []
          for filename, entries in after.get('results', {}).items():
              for entry in entries:
                  key = (filename, entry.get('type'), entry.get('hashed_secret'))
                  if key in known:
                      continue
                  new_entries.append((filename, entry))
                  if filename not in allowed_files or entry.get('type') != 'Secret Keyword':
                      unexpected.append((filename, entry.get('line_number'), entry.get('type')))

          if unexpected:
              for filename, line, kind in unexpected:
                  print(f'UNEXPECTED file={filename} line={line} type={kind}')
              raise SystemExit('Refusing to approve unexpected scanner findings.')

          if not new_entries:
              raise SystemExit('Expected reviewed test fixtures were not found.')

          for filename, entry in new_entries:
              entry['is_secret'] = False
              print(f'APPROVED_TEST_FIXTURE file={filename} line={entry.get("line_number")}')

          baseline_path.write_text(json.dumps(after, indent=2) + '\n')
          print(f'APPROVED_COUNT={len(new_entries)}')
          PY

      - name: Commit reviewed baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .secrets.baseline
          git diff --cached --check
          git commit -m "chore(security): audit test fixture scanner findings"
          git push origin HEAD:ci/fix-main-quality-gates
