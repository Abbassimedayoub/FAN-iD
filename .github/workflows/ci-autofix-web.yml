name: ci-autofix-web

on:
  push:
    branches: [ci/fix-main-quality-gates]

permissions:
  contents: write

jobs:
  autofix-web:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/fix-main-quality-gates

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Upgrade patched test dependencies
        working-directory: web
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.devDependencies['vitest'] = '4.1.11';
          pkg.devDependencies['@vitest/coverage-v8'] = '4.1.11';
          pkg.overrides = {...(pkg.overrides || {}), 'js-yaml': '4.3.2'};
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only
          npm ci
          npm audit --audit-level=moderate

      - name: Apply Prettier
        working-directory: web
        run: npm run format

      - name: Verify web quality after autofix
        working-directory: web
        run: |
          npm run format:check
          npm run lint
          npm run typecheck

      - name: Commit generated web fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web
          if git diff --cached --quiet; then
            echo "No web changes to commit."
            exit 0
          fi
          git commit -m "fix(ci): format web and patch audited dependencies"
          git push origin HEAD:ci/fix-main-quality-gates
