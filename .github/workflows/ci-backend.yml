name: ci-backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/ci-backend.yml", ".importlinter"]
  push:
    branches: [main, develop]
    paths: ["backend/**"]

defaults:
  run:
    working-directory: backend

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  DJANGO_SECRET_KEY: ci-test-secret-key-not-for-prod-xxxxxxxxxxxxxxxxxxxx
  DATABASE_URL: postgresql://fanid:fanid@localhost:5432/fanid_test
  REDIS_URL: redis://localhost:6379/0
  CELERY_BROKER_URL: redis://localhost:6379/3
  CELERY_RESULT_BACKEND: redis://localhost:6379/4
  APP_VERSION: ci
  COMMIT_SHA: ${{ github.sha }}

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    # Cible CI < 6 minutes (§5.2 Source B) : cache pip + services en parallèle du checkout.
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:15.8-alpine
        env:
          POSTGRES_DB: fanid_test
          POSTGRES_USER: fanid
          POSTGRES_PASSWORD: fanid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fanid" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # nécessaire pour le scan de secrets sur l'historique complet

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/test.txt

      - name: Installer les dépendances
        run: pip install -r requirements/test.txt

      # --- Porte 1 : lint & format ---
      - name: Black (format)
        run: black --check .
      - name: isort (imports)
        run: isort --check-only .
      - name: Flake8 (lint)
        run: flake8 .

      # --- Porte 2 : types ---
      - name: mypy (core, mode strict progressif)
        run: mypy apps/core

      # --- Porte 3+4 : tests + couverture (>= 80% sur core, jamais en baisse) ---
      - name: pytest (unitaires + intégration + concurrence)
        run: pytest -n auto

      # --- Porte 5 : migrations ---
      - name: makemigrations --check (dérive de schéma)
        run: python manage.py makemigrations --check --dry-run
      - name: django-migration-linter
        run: python manage.py lintmigrations

      # --- Porte 6 : architecture (import-linter) ---
      - name: import-linter (core indépendant, pas de dépendance circulaire)
        run: lint-imports

      # --- Porte 7 : sécurité ---
      - name: Bandit (haute sévérité)
        run: bandit -r apps config -ll
      - name: pip-audit
        run: pip-audit -r requirements/prod.txt
      - name: detect-secrets (historique complet)
        working-directory: .
        run: |
          pip install detect-secrets
          detect-secrets scan --baseline .secrets.baseline

      # --- Porte 8 : build Docker + démarrage + /health ---
      - name: Build image Docker (stage dev)
        working-directory: .
        run: docker build -t fanid-api:ci --target dev backend
