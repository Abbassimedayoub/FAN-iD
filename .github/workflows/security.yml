name: security

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"  # scan hebdomadaire (dépendances) — cohérent avec Dependabot §5.1 Source B

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan de l'HISTORIQUE complet, pas seulement le diff (§60 master prompt)

      - name: detect-secrets (historique complet, bloquant)
        run: |
          pip install detect-secrets
          detect-secrets scan --baseline .secrets.baseline
          # AUCUN bypass : un secret nouvellement détecté (diff non vide) ou
          # un secret déjà connu mais non audité comme faux positif DOIT
          # faire échouer la CI (§60 master prompt — "la CI doit échouer
          # réellement en cas de faille de sécurité").
          git diff --exit-code -- .secrets.baseline
          detect-secrets audit --report --fail-on-unaudited .secrets.baseline

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements/prod.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: npm ci + npm audit (bloquant — pas de skip silencieux)
        working-directory: web
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::web/package-lock.json absent — voir docs/implementation/SPRINT_TEST_REPORT.md (section lockfile)."
            exit 1
          fi
          npm ci
          npm audit --audit-level=high

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -r backend/apps backend/config -ll
