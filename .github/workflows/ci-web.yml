name: ci-web

on:
  pull_request:
    paths: ["web/**", ".github/workflows/ci-web.yml"]
  push:
    branches: [main, develop]
    paths: ["web/**"]

defaults:
  run:
    working-directory: web

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier (vérification)
        run: npm run format:check

      - name: TypeScript strict (tsc --noEmit)
        run: npm run typecheck

      - name: Tests
        run: npm run test -- --run

      - name: Build (budget bundle < 200 Ko gzip, §4.3 Source B)
        run: npm run build

      - name: npm audit (haute sévérité)
        run: npm audit --audit-level=high
