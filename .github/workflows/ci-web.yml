name: ci-web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
      - ".coverage-baseline.json"
      - "scripts/coverage_gate.py"
  push:
    branches: [main, develop]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
      - ".coverage-baseline.json"
      - "scripts/coverage_gate.py"

defaults:
  run:
    working-directory: web

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier (vérification)
        run: npm run format:check

      - name: TypeScript strict (tsc --noEmit)
        run: npm run typecheck

      - name: Tests + couverture
        run: npm run test -- --run --coverage

      - name: Couverture — protéger la référence versionnée
        working-directory: .
        env:
          COVERAGE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/coverage_gate.py guard-baseline --stack web --base "$COVERAGE_BASE_SHA"

      - name: Couverture — non-régression web
        working-directory: .
        run: python3 scripts/coverage_gate.py check --stack web

      - name: Build (budget bundle < 200 Ko gzip, §4.3 Source B)
        run: npm run build

      - name: npm audit (haute sévérité)
        run: npm audit --audit-level=high
