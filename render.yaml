          type: web
          envVarKey: NOTIFICATION_BACKEND
      - key: EMAIL_HOST
        fromService:
          name: fanid-api
          type: web
          envVarKey: EMAIL_HOST
      - key: EMAIL_PORT
        fromService:
          name: fanid-api
          type: web
          envVarKey: EMAIL_PORT
      - key: EMAIL_HOST_USER
        fromService:
          name: fanid-api
          type: web
          envVarKey: EMAIL_HOST_USER
      - key: EMAIL_HOST_PASSWORD
        fromService:
          name: fanid-api
          type: web
