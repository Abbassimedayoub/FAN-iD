[flake8]
max-line-length = 110
extend-ignore = E203, W503
exclude = .venv,migrations,staticfiles
per-file-ignores =
    */migrations/*.py: E501

[mypy]
python_version = 3.12
plugins = mypy_django_plugin.main
ignore_missing_imports = True
check_untyped_defs = True

[mypy.plugins.django-stubs]
django_settings_module = config.settings.test

[mypy-apps.core.*]
disallow_untyped_defs = True

# Annoter des fonctions de test n'apporte aucune garantie de sûreté et
# représentait ~89 des 125 erreurs du premier passage réel de mypy (P1-000).
# La rigueur reste entière sur le code de production.
[mypy-apps.core.tests.*]
disallow_untyped_defs = False
